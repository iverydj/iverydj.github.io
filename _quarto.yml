    theme: default
    mainfont: "Source Sans 3"
    fontsize: 17px
    smooth-scroll: false
    css: styles.css
    toc: false
    anchor-sections: true
    link-external-newwindow: true
    grid:
      body-width: 1080px
      margin-width: 0px
      sidebar-width: 0px
