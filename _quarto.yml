project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research.qmd
    - career.qmd
    - publications.qmd
    - cv.qmd

website:
  title: "Dong-Joon Yi"
  navbar:
    background: "#f7f6f2"
    foreground: "#242e2b"
    collapse: true
    collapse-below: lg
    pinned: true
    left:
      - href: research.qmd
        text: Research
      - href: career.qmd
        text: Career
      - href: publications.qmd
        text: Publications
      - href: cv.qmd
        text: CV
  page-footer:
    left: "© Dong-Joon Yi"
    right: "iver.ydj@gmail.com"

format:
  html:
    theme: default
    mainfont: "Source Sans 3"
    fontsize: 17px
    smooth-scroll: false
    css: styles.css
    include-in-header:
      text: |
        <noscript>
        <style>
        @media (max-width: 991.98px) {
          #quarto-header .navbar > .navbar-container { flex-wrap: nowrap; }
          #quarto-header .navbar-toggler, #quarto-header #quarto-search { display: none; }
          #quarto-header #navbarCollapse { display: flex; flex: 1 1 auto; padding: 0; border: 0; }
          #quarto-header .navbar-nav { flex-direction: row; gap: 0.5rem; margin-left: auto; overflow: visible; }
        }
        @media (max-width: 680px) {
          #quarto-header .navbar > .navbar-container { padding-inline: 0.65rem; }
          #quarto-header .navbar-brand { margin-right: 0.65rem; }
          #quarto-header .navbar-brand, #quarto-header .navbar-title { font-size: 0.95rem; }
          #quarto-header .navbar-nav { gap: 0.35rem; }
          #quarto-header .navbar-nav .nav-link { font-size: 0.75rem; padding-inline: 0 !important; }
        }
        </style>
        </noscript>
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    grid:
      body-width: 1080px
      margin-width: 0px
      sidebar-width: 0px
