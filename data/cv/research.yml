# Research overview. Revised 2026-10-09: defect physics is the theme; spectroscopy and
# machine learning are the tools.
# Used by the Home (summary + interests), Research and CV pages.
# Inline <span> classes: rs-mat = material, rs-tech = technique, rs-method = method.
# Item status: Published | In preparation | Ongoing. Unpublished work stays at topic level.
# `refs`: stable pdf ids (assets/pubs/<n>.pdf) of supporting papers; my author role is computed.
summary: >-
  I study how defects and disorder determine the electrical and optical properties of solid-state
  materials. I measure defect levels with <span class="rs-tech">transient spectroscopy (PICTS/DLTS)</span>
  and map disorder and strain with <span class="rs-tech">Raman and tip-enhanced Raman nanospectroscopy
  (TERS)</span>. I also use <span class="rs-method">interpretable machine learning</span> to interpret
  experimental data physically, identifying which measured features reflect defects and disorder and how
  they connect to material properties.

interests:
  - Defects in Solid Materials
  - Defect Engineering & Electrical Devices
  - Electrical Defect Spectroscopy (PICTS/DLTS)
  - Raman & Tip-Enhanced Nanospectroscopy
  - Interpretable AI for Science

themes:
  - title: Defect Physics in Solid-State Materials
    question: How do defects affect the electrical properties of solid-state materials and devices?
    items:
      - status: Published
        refs: [8, 1, 2, 3]
        text: >-
          Quantitative analysis of defect states in <span class="rs-mat">oxide semiconductors</span> and their
          correlation with device characteristics and stability.
      - status: In preparation
        text: >-
          Defect-mediated control of carrier type in <span class="rs-mat">2D semiconductors</span> for
          complementary devices.

  - title: Defect and Nanoscale Spectroscopy
    question: How can defect states and local structure be measured, from devices to the nanoscale?
    items:
      - status: Ongoing
        text: >-
          <span class="rs-tech">Transient spectroscopy (DLTS/PICTS)</span> of defect states in
          <span class="rs-mat">2D semiconductors</span>.
      - status: Ongoing
        text: >-
          Nanoscale mapping of defects and strain in <span class="rs-mat">2D materials</span> by
          <span class="rs-tech">tip-enhanced spectroscopy</span>.
      - status: Published
        refs: [9]
        text: >-
          <span class="rs-tech">Electromagnetic simulation</span> of near-field enhancement in tip-enhanced
          spectroscopy.
      - status: Ongoing
        text: >-
          Modulation of excitonic properties in <span class="rs-mat">2D semiconductors</span> by coupling to
          <span class="rs-mat">plasmonic nanostructures</span>.

  - title: Interpretable AI for Science
    question: How can machine learning extract physically interpretable information from experimental data?
    items:
      - status: In preparation
        text: >-
          Correlation of <span class="rs-tech">Raman</span> spectra with electrical properties using
          <span class="rs-method">interpretable machine learning</span>.
      - status: In preparation
        text: >-
          <span class="rs-method">Deep-learning</span>-based noise reduction of experimental spectra with
          preservation of spectral parameters.
      - status: Published
        refs: [10]
        text: >-
          Effect of numerical precision on the reliability of <span class="rs-method">scientific machine
          learning</span>.
      - status: In preparation
        text: >-
          Review of the physical interpretability of machine-learning analysis in spectroscopy.
