# Research overview. Revised 2026-10-09: defect physics is the theme; spectroscopy and
# machine learning are the tools.
# Used by the Home (summary + interests), Research and CV pages.
# Inline <span> classes: rs-mat = material, rs-tech = technique, rs-method = method.
# Item status: Published | In preparation | Ongoing. Unpublished work stays at topic level.
summary: >-
  My research asks how defects and disorder set the electrical and optical behavior of
  low-dimensional and oxide semiconductors. I measure them with
  <span class="rs-tech">electrical defect spectroscopy</span> and
  <span class="rs-tech">Raman-family (nano)spectroscopy</span>, and use
  <span class="rs-method">interpretable machine learning</span> to extract physical parameters from
  spectra and connect them to device behavior.

interests:
  - Defects & Disorder in Semiconductors
  - Defect-Engineered Doping & Complementary Devices
  - Electrical Defect Spectroscopy (PICTS/DLTS)
  - Raman & Tip-Enhanced Nanospectroscopy
  - Interpretable Machine Learning for Spectroscopy
  - Plasmon–Exciton Coupling in 2D Materials

themes:
  - title: Defects and Doping That Set Device Function
    question: How do defects and dopants control carrier type, trapping, and stability in semiconductor devices?
    items:
      - status: Published
        text: >-
          Quantified defect energy levels, densities, and trapping dynamics in
          <span class="rs-mat">amorphous oxide semiconductor</span> thin-film transistors with
          <span class="rs-tech">photo-induced current transient spectroscopy (PICTS)</span>, and related them
          to mobility and bias-stress stability.
      - status: In preparation
        text: >-
          Controlling the carrier type of <span class="rs-mat">2D semiconductors</span> through defect
          engineering to build complementary (n/p) inverters.
      - status: Ongoing
        text: >-
          Extending PICTS to <span class="rs-mat">2D semiconductors</span> to resolve defect levels in
          atomically thin channels.

  - title: Reading Defects and Disorder from Spectra
    question: What can a spectrum tell us, quantitatively, about disorder and the properties it controls?
    items:
      - status: In preparation
        text: >-
          Predicting the electrical conductivity of <span class="rs-mat">carbon-nanotube</span> films from
          Raman disorder bands, with <span class="rs-method">explainable AI</span> identifying which spectral
          features carry the information.
      - status: In preparation
        text: >-
          Recovering noisy, experimentally measured Raman spectra of <span class="rs-mat">2D materials</span>
          with <span class="rs-method">deep learning</span> while preserving physical parameters such as peak
          position and width.
      - status: In preparation
        text: >-
          Writing an invited review on when an AI-derived explanation of a spectrum counts as physical
          evidence.

  - title: Defects, Strain, and Excitons at the Nanoscale
    question: What changes below the optical diffraction limit?
    items:
      - status: Ongoing
        text: >-
          Mapping local defects and strain in <span class="rs-mat">2D materials</span> with
          <span class="rs-tech">tip-enhanced Raman spectroscopy (TERS)</span>.
      - status: Published
        text: >-
          Modeled gap-mode near-field enhancement with <span class="rs-tech">finite-difference time-domain
          (FDTD)</span> simulations to validate machine-learning predictions of TERS nanoprobe geometry.
      - status: Ongoing
        text: >-
          Modulating excitons in <span class="rs-mat">2D semiconductors</span> through energy transfer and
          plasmon–exciton coupling in <span class="rs-mat">nanoparticle-on-mirror</span> cavities, designed
          with GPU-accelerated FDTD.
